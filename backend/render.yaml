services:
  - type: web
    name: resumeai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # --max-requests recycles workers periodically so long-lived memory growth
    # (large analyses cached in-process) can never silently eat the free tier's
    # 512MB and kill a worker mid-request (bare 500, no CORS headers).
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --max-requests 200 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "resumeai-secret-key-12345"
      - key: FIREBASE_PROJECT_ID
        value: "resumeai-9"
      # Set these in Render Dashboard with your actual keys:
      # - GOOGLE_API_KEY
      # - OPENAI_API_KEY
      # - SAMBANOVA_API_KEY
      # - FIREBASE_PRIVATE_KEY
      # - FIREBASE_CLIENT_EMAIL
