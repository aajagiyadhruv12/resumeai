services:
  - type: web
    name: resumeai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # --max-requests recycles workers periodically so long-lived memory growth
    # (large analyses cached in-process) can never silently eat the free tier's
    # 512MB and kill a worker mid-request (bare 500, no CORS headers).
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --max-requests 200 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: FLASK_DEBUG
        value: "False"
      - key: FIREBASE_PROJECT_ID
        value: "resumeai-9"
# Set these in Render Dashboard -> Environment (do NOT commit real values):
#   REQUIRED (backend refuses to boot without them):
#     - SECRET_KEY          (any long random string)
#     - ADMIN_JWT_SECRET    (any long random string, different from SECRET_KEY)
#   AI providers (at least one required for analysis):
#     - GOOGLE_API_KEY
#     - GROQ_API_KEY
#   Firebase (needed for history/registration/storage):
#     - FIREBASE_PRIVATE_KEY
#     - FIREBASE_CLIENT_EMAIL
#     - FIREBASE_STORAGE_BUCKET
#   Optional:
#     - ALLOWED_ORIGINS (comma-separated; defaults cover airesumer.qzz.io + localhost)
