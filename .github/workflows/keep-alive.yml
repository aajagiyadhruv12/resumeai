name: Keep Render backend awake

on:
  schedule:
    # Every 5 minutes (GitHub's minimum interval) — Render free tier sleeps
    # after 15 minutes of inactivity, and scheduled jobs can be delayed by
    # several minutes, so ping twice as often as the sleep window demands.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 --retry 2 --retry-delay 10 https://resumeai-fj7h.onrender.com/health)
          echo "Backend responded with HTTP $code"
          # 503/522 just means the service was asleep and is now waking up —
          # the ping itself is what wakes it, so don't fail the job.
